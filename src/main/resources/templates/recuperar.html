<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-4">Recuperar Contraseña</h4>
                        
                        <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
                        <div th:if="${errorRecuperar}" class="alert alert-danger" th:text="${errorRecuperar}"></div>

                        <form th:action="@{/recuperar}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Ingresa tu correo registrado</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-warning w-100">Recuperar</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a th:href="@{/login}">Volver al Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
