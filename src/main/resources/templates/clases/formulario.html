<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Clase - Gimnasio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">Programar Nueva Clase</h3>
                        
                        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                        <form th:action="@{/clases/guardar}" th:object="${clase}" method="post">
                            
                            <div class="mb-3">
                                <label class="form-label">Nombre de la Clase (Ej. CrossFit, Yoga)</label>
                                <input type="text" class="form-control" th:field="*{nombre}" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Entrenador a cargo</label>
                                <select class="form-select" th:field="*{entrenador}" required>
                                    <option value="">Seleccione un entrenador...</option>
                                    <option th:each="e : ${entrenadores}" th:value="${e.id}" th:text="${e.nombre}"></option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('entrenador')}" th:errors="*{entrenador}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Fecha y Hora de Inicio</label>
                                <input type="datetime-local" class="form-control" th:field="*{fechaInicio}" required>
                                <div class="form-text text-muted">La clase durará exactamente 1 hora.</div>
                                <div class="text-danger small" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Cupo Máximo</label>
                                <input type="number" class="form-control" th:field="*{cupoMaximo}" min="1" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('cupoMaximo')}" th:errors="*{cupoMaximo}"></div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/clases}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar Clase</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
