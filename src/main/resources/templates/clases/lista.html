<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clases - Gimnasio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Clases</h2>
            <div>
                <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
                </form>
            </div>
        </div>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="d-flex justify-content-end mb-3">
            <a th:href="@{/clases/nuevo}" class="btn btn-primary">+ Nueva Clase</a>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Clase</th>
                            <th>Entrenador</th>
                            <th>Fecha y Hora (Inicio - Fin)</th>
                            <th>Cupo Máximo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${clases}">
                            <td th:text="${c.id}"></td>
                            <td th:text="${c.nombre}"></td>
                            <td th:text="${c.entrenador.nombre}"></td>
                            <td>
                                <span th:text="${#temporals.format(c.fechaInicio, 'dd/MM/yyyy HH:mm')}"></span> 
                                - 
                                <span th:text="${#temporals.format(c.fechaFin, 'HH:mm')}"></span>
                            </td>
                            <td th:text="${c.cupoMaximo}"></td>
                        </tr>
                    </tbody>
                </table>
                <div th:if="${#lists.isEmpty(clases)}" class="alert alert-info text-center">
                    No hay clases programadas todavía.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
