<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Gimnasio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 text-center">
        <h1>¡Bienvenido al Sistema del Gimnasio!</h1>
        <p>Has iniciado sesión correctamente.</p>
        
        <!-- Botón para ir a la gestión de usuarios -->
        <a th:href="@{/usuarios}" class="btn btn-primary mt-3">Gestionar Usuarios</a>
        <br><br>
        <form th:action="@{/logout}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-danger">Cerrar Sesión</button>
        </form>
        <br><br>
        <a th:href="@{/clases}" class="btn btn-info mt-3 text-white">Gestionar Clases</a>
    </div>
</body>
</html>
